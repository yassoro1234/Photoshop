<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>CREATIVE STUDIO</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/picker.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/anim.css">
</head>
<body>
<div id="app">
  <div id="menubar"></div>

  <div id="tabs"></div>

  <div id="opts"></div>

  <div id="ws">
    <div id="tools"></div>

    <div id="stage">
      <div id="canvasWrap">
        <canvas id="comp"></canvas>
        <canvas id="ov"></canvas>
      </div>
      <div id="dropHint" data-i18n="أفلت الصورة لإضافتها كطبقة"></div>
    </div>

    <div id="resizer" data-i18n-title="اسحب لتغيير العرض"></div>

    <div id="side">
      <div class="hdr">
        <span data-i18n="Layers">Layers</span>
        <button class="ico" onclick="togglePanel()" data-i18n-title="إغلاق">✕</button>
      </div>
      <div id="layerCtl">
        <div class="row">
          <button onclick="addLayer()" data-i18n="+ طبقة" data-i18n-title="طبقة جديدة"></button>
          <button onclick="addGroup()" data-i18n="📁 مجموعة" data-i18n-title="مجموعة جديدة"></button>
          <button onclick="duplicateLayer()" data-i18n="تكرار" data-i18n-title="تكرار الطبقة"></button>
          <button onclick="deleteLayer()" data-i18n="حذف" data-i18n-title="حذف الطبقة"></button>
        </div>
        <div class="row">
          <select id="blend" onchange="setBlend(this.value)">
            <option value="source-over" data-i18n="عادي"></option>
            <option value="multiply" data-i18n="ضرب"></option>
            <option value="screen" data-i18n="شاشة"></option>
            <option value="overlay" data-i18n="تراكب"></option>
            <option value="darken" data-i18n="تغميق"></option>
            <option value="lighten" data-i18n="تفتيح"></option>
            <option value="difference" data-i18n="فرق"></option>
          </select>
        </div>
        <div class="row">
          <span data-i18n="الشفافية"></span>
          <input type="range" id="opacity" min="0" max="100" value="100"
                 oninput="setOpacity(this.value)" onchange="commitOpacity()">
          <span id="opVal">100%</span>
        </div>
        <div class="row">
          <button onclick="moveLayer(1)" data-i18n-title="للأعلى">▲</button>
          <button onclick="moveLayer(-1)" data-i18n-title="للأسفل">▼</button>
          <button onclick="mergeDown()" data-i18n="دمج ▼" data-i18n-title="دمج للأسفل"></button>
          <button onclick="toggleLock(state.active)" data-i18n-title="قفل">🔒</button>
          <button onclick="addMask()" data-i18n-title="إضافة قناع">▣</button>
          <button onclick="toggleMaskEdit()" data-i18n-title="تحرير القناع">✎▣</button>
        </div>
      </div>
      <div id="layers"></div>
    </div>
  </div>

  <div id="status">
    <span id="docInfo">—</span>
    <span id="cursorInfo"></span>
    <span class="sp"></span>
    <span class="mobileHide" data-i18n="Space + drag · wheel to zoom"></span>
  </div>
</div>

<div id="home"></div>
<div id="anim"></div>

<div id="scrim" onclick="togglePanel()"></div>
<div id="toast"></div>
<div id="ctx"></div>

<div id="modal">
  <div class="box">
    <div class="mhead"><span id="mTitle"></span><button id="mClose" class="ico" data-i18n-title="إغلاق">✕</button></div>
    <div id="mBody"></div>
    <div id="mFoot"></div>
  </div>
</div>

<input type="file" id="fileIn" accept="image/*" multiple>
<input type="file" id="projIn" accept=".json,application/json">
<input type="file" id="fontIn" accept=".ttf,.otf,.woff,.woff2">

<div id="cpick">
  <canvas id="cpWheel" width="220" height="220"></canvas>
  <div class="cpRow">
    <input id="cpHex" maxlength="7" spellcheck="false">
    <span class="cpPrev"><i id="cpOld"></i><i id="cpNew"></i></span>
  </div>
  <div class="cpRow">
    <label>R <input type="number" id="cpR" min="0" max="255"></label>
    <label>G <input type="number" id="cpG" min="0" max="255"></label>
    <label>B <input type="number" id="cpB" min="0" max="255"></label>
  </div>
  <div class="cpSec" data-i18n="ألوان حديثة"></div>
  <div id="cpRecent"></div>
  <div class="cpRow">
    <button id="cpEyedrop" data-i18n="اختر من الصورة"></button>
    <button id="cpClose" class="ico" data-i18n-title="إغلاق">✕</button>
  </div>
</div>
<div id="loupe"><canvas id="loupeCv" width="132" height="132"></canvas><span id="loupeHex">—</span></div>

<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/doc.js"></script>
<script src="js/view.js"></script>
<script src="js/tools.js"></script>
<script src="js/select.js"></script>
<script src="js/adjust.js"></script>
<script src="js/image.js"></script>
<script src="js/io.js"></script>
<script src="js/library.js"></script>
<script src="js/settings.js"></script>
<script src="js/home.js"></script>
<script src="js/anim.js"></script>
<script src="js/color.js"></script>
<script src="js/text.js"></script>
<script src="js/transform.js"></script>
<script src="js/ui.js"></script>
<script src="js/back.js"></script>
</body>
</html>
