name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate app icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1e1e1e' --iconBackgroundColorDark '#1e1e1e'

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Configure signing and version code
        run: |
          cp scripts/signing.gradle android/app/signing.gradle
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          if [ -n "$KEYSTORE_B64" ]; then
            # Remove any whitespace/line breaks introduced when the secret was pasted
            if echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/release.keystore 2>/dev/null \
               && keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"
              echo "Release signing enabled"
            else
              echo "::warning::ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD is invalid. Building an unsigned debug APK instead. Re-create the secret from keystore.b64."
              rm -f android/app/release.keystore
            fi
          else
            echo "No keystore secret found: building a debug APK"
          fi

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect outputs
        run: |
          mkdir -p dist
          find android/app/build/outputs -name "*.apk" -exec sh -c 'cp "$1" "dist/PhotoStudio-${GITHUB_RUN_NUMBER}-$(basename "$1")"' _ {} \;
          find android/app/build/outputs -name "*.aab" -exec sh -c 'cp "$1" "dist/PhotoStudio-${GITHUB_RUN_NUMBER}-$(basename "$1")"' _ {} \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: photo-studio-android-${{ github.run_number }}
          path: dist/*

      - name: Publish downloadable GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: Photo Studio build ${{ github.run_number }}
          files: dist/*
          prerelease: true
